{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-lg border-0 rounded-4 p-3">
      <div class="card-body">
        <h1 class="h4 text-center mb-3 fw-bold">Iniciar sesión</h1>
        <p class="text-muted text-center mb-4">Sistema de control de fumigación y limpieza</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input class="form-control" name="username" required autocomplete="username">
          </div>
          <div class="mb-4">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" name="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="small text-muted text-center mt-3 mb-0">
          Usuario inicial: <strong>admin</strong> / Clave: <strong>admin123</strong>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
