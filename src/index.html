<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Clientes y Productos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Sistema de Ventas Editable</h1>
      <p>Gestiona clientes, productos, precios e imágenes. Calcula Subtotal, IGV y Total automáticamente.</p>
    </header>

    <main>
      <section class="panel">
        <h2>Clientes</h2>
        <form id="client-form" class="grid-form">
          <input type="hidden" id="client-id" />
          <label>Nombre <input id="client-name" required /></label>
          <label>Documento <input id="client-doc" required /></label>
          <label>Correo <input id="client-email" type="email" required /></label>
          <label>Imagen <input id="client-image" type="file" accept="image/*" /></label>
          <button type="submit">Guardar cliente</button>
        </form>
        <div id="client-list" class="cards"></div>
      </section>

      <section class="panel">
        <h2>Productos</h2>
        <form id="product-form" class="grid-form">
          <input type="hidden" id="product-id" />
          <label>Nombre <input id="product-name" required /></label>
          <label>Código <input id="product-code" required /></label>
          <label>Precio (S/.) <input id="product-price" type="number" step="0.01" min="0" required /></label>
          <label>Imagen <input id="product-image" type="file" accept="image/*" /></label>
          <button type="submit">Guardar producto</button>
        </form>
        <div id="product-list" class="cards"></div>
      </section>

      <section class="panel">
        <h2>Comprobante de Venta</h2>
        <form id="invoice-form" class="grid-form">
          <label>Cliente
            <select id="invoice-client" required></select>
          </label>
          <label>Producto
            <select id="invoice-product" required></select>
          </label>
          <label>Cantidad
            <input id="invoice-qty" type="number" min="1" value="1" required />
          </label>
          <label>Precio unitario (S/.)
            <input id="invoice-unit-price" type="number" min="0" step="0.01" required />
          </label>
          <div class="totals">
            <p>Subtotal: <strong id="subtotal">S/. 0.00</strong></p>
            <p>IGV (18%): <strong id="igv">S/. 0.00</strong></p>
            <p>Total: <strong id="total">S/. 0.00</strong></p>
          </div>
          <button type="submit">Registrar venta</button>
        </form>
        <div id="invoice-list" class="table-container"></div>
      </section>
    </main>

    <template id="card-template">
      <article class="card">
        <img class="thumb" alt="Imagen" />
        <div class="content"></div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
